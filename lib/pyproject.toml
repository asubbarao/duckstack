[project]
name = "duckstack"
version = "0.1.0"
description = "Dataswarm-style asset factory for DuckDB: a step is a SELECT, one factory makes it that run's table, and the Step ships to any Duck in one call. Library and MCP."
requires-python = ">=3.12,<4.0"
dependencies = [
    "duckdb>=1.5",
    "mcp>=1.2",
]

[project.scripts]
duckstack-mcp = "duckstack.mcp:main"

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "pytest>=8",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duckstack"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
