name: Tests

# Every PR runs the whole suite. The path-filtered smoke workflows stay as they are.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Run the full test suite
        run: >-
          uv run --no-project --with pytest --with mcp --with duckdb-cli==1.5.5
          python -m pytest tests -q
