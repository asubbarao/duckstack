name: Portable Bootstrap Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/portable/**'
      - 'tests/test_bootstrap.py'
      - '.github/workflows/portable-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Verify portable CLI and stdio MCP entrypoints
        run: >-
          uv run --no-project --with pytest --with mcp --with duckdb-cli==1.5.5
          python -m pytest tests/test_bootstrap.py -q
