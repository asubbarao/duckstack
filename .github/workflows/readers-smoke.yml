name: Portable Reader Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/ci-timing/references/github_*.sql'
      - 'skills/duck-hunt/references/log_events.sql'
      - 'tests/test_readers.py'
      - 'docs/portable-readers.md'
      - '.github/workflows/readers-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Verify real extensions against deterministic source fixtures
        run: >-
          uv run --no-project --with pytest --with duckdb-cli==1.5.5
          python -m pytest tests/test_readers.py -q
