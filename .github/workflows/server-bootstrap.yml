name: Server boot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUACK_TOKEN: ci-boot-token
    steps:
      - uses: actions/checkout@v6
      - name: Boot setup.sql on an empty database and query /sql
        run: |
          curl -sSLo duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip duckdb
          mkdir -p ~/.duck/logs ~/.duck/tmp
          ./duckdb -bail ~/.duck/dev.duckdb -init server/setup.sql < /dev/zero > server.out 2> server.err &
          for i in $(seq 1 120); do
            curl -sf -H 'content-type: application/json' --data '{"sql":"SELECT 42 AS up"}' http://127.0.0.1:9495/sql && exit 0
            kill -0 $! || break
            sleep 1
          done
          sed -n '1,100p' server.err
          exit 1
