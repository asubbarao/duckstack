name: Server Bootstrap Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUACK_TOKEN: ci-bootstrap-token
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      # setup.sql as dev runs it, in an empty HOME: no transcripts, no lake, no inframe checkout contents.
      # The CLI reads stdin only after setup.sql, so the .print the feeder writes first marks the end of setup.sql.
      - name: Boot setup.sql and query the scratch server
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          export HOME="$scratch/home"
          mkdir -p "$HOME/.duck/logs" "$HOME/.duck/tmp" "$HOME/inframe"
          export QUACK_NATIVE_LOG="$HOME/.duck/logs/duckdb_log.csv"

          mkfifo "$scratch/server.stdin"
          { echo '.print setup_complete'; while :; do sleep 3600; done; } > "$scratch/server.stdin" &
          feeder_pid=$!
          uv run --no-project --with duckdb-cli==1.5.6 duckdb -bail "$scratch/server.duckdb" \
            -cmd '.read server/setup.sql' < "$scratch/server.stdin" > "$scratch/server.out" 2> "$scratch/server.err" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            kill "$feeder_pid" 2>/dev/null || true
            wait "$feeder_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 300); do
            if grep -q setup_complete "$scratch/server.out" || ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! grep -q setup_complete "$scratch/server.out"; then
            echo "setup.sql did not finish" >&2
            sed -n '1,240p' "$scratch/server.err" >&2
            exit 1
          fi

          answer="$(curl --fail-with-body -sS -H 'Content-Type: application/json' \
            --data-raw '{"sql":"SELECT 42 AS answer"}' \
            "http://127.0.0.1:9495/sql")"
          test "$answer" = '[{"answer":42}]'

      - name: Confirm a broken table macro fails startup
        run: |
          set -euo pipefail
          scratch_home="$(mktemp -d)"
          if printf '%s\n' 'CREATE OR REPLACE MACRO ci_broken() AS TABLE SELECT * FROM extension_that_does_not_exist();' \
            | HOME="$scratch_home" uv run --no-project --with duckdb-cli==1.5.6 duckdb -bail :memory:; then
            echo 'broken macro unexpectedly succeeded' >&2
            exit 1
          fi
