name: Python library

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".claude-plugin/**"
      - ".mcp.json"
      - "lib/**"
      - "skills/asset-factory/**"
      - "README.md"
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".claude-plugin/**"
      - ".mcp.json"
      - "lib/**"
      - "skills/asset-factory/**"
      - "README.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: lib/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Check formatting and lint
        run: uv run --locked ruff check .

      - name: Type-check
        run: uv run --locked mypy duckstack
